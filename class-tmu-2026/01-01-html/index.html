<!-- HTML5で書かれた文書であることを宣言 -->
<!DOCTYPE html>

<!-- HTML文書全体の開始。言語を日本語に設定 -->
<html lang="ja">

<!-- ページの設定情報を記述する部分 -->
<head>
  <!-- 文字コードをUTF-8に設定 -->
  <meta charset="UTF-8">

  <!-- スマートフォンでも画面幅に合わせて表示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ブラウザのタブに表示するタイトル -->
  <title>Hello World</title>

<!-- headの閉じタグ -->
</head>

<!-- ブラウザの画面に表示する内容を記述する部分 -->
<body>
  <!-- 見出しを表示 -->
  <h1>Hello World</h1>

  <!-- 段落を表示 -->
  <p>これはHTMLで作った最初のウェブページです。</p>

<!-- bodyの閉じタグ -->
</body>

<!-- HTML文書全体の終了 -->
</html>
